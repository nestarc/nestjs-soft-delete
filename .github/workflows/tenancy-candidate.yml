name: Tenancy Candidate

on:
  workflow_dispatch:
    inputs:
      tenancy-ref:
        description: Exact nestjs-tenancy commit SHA to pack as 0.16.0 candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Tenancy candidate / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.13.0, 24]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: soft_delete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check out exact tenancy candidate
        uses: actions/checkout@v4
        with:
          repository: nestarc/nestjs-tenancy
          ref: ${{ inputs.tenancy-ref }}
          path: .tenancy-candidate

      - name: Verify exact tenancy commit
        working-directory: .tenancy-candidate
        run: |
          node -e "if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SHA)) process.exit(1)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        env:
          EXPECTED_SHA: ${{ inputs.tenancy-ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pack tenancy 0.16.0 candidate
        id: tenancy
        working-directory: .tenancy-candidate
        run: |
          npm ci
          npm version 0.16.0 --no-git-tag-version --allow-same-version --ignore-scripts
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "tarball=$RUNNER_TEMP/nestarc-tenancy-0.16.0.tgz" >> "$GITHUB_OUTPUT"

      - name: Strict install, PostgreSQL E2E, and packed consumer
        run: npm run test:e2e:tenancy-candidate -- --tenancy-tarball "${{ steps.tenancy.outputs.tarball }}"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/soft_delete_test
