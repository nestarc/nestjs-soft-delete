name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: soft_delete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) { console.error('tag/package version mismatch'); process.exit(1); }"

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Published Bridge Versions
        run: npm ls @nestarc/audit-log @nestarc/tenancy

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: E2E Tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/soft_delete_test

      - name: Build & Public Type Test
        run: npm run test:types

      - name: Verify Package Contents
        run: npm pack --dry-run

      - name: Publish with trusted publishing
        run: npm publish --access public
